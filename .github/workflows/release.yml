name: Release

on:
  release:
    types: [published]

jobs:
  release:
    permissions:
      id-token: write
      contents: write
      packages: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'v24.11.1'
          scope: '@joinmarket-ng'

      - name: Install
        run: npm clean-install

      - name: Build
        run: npm run build

      - name: Publish to GitHub Packages
        run: |
          npm set //npm.pkg.github.com/:_authToken ${{ secrets.GITHUB_TOKEN }}
          npm run publish:ghr

      # Optional: Publish to npm Registry. Requires NPM_TOKEN secret.
      - name: Publish to npm Registry
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm set //registry.npmjs.org/:_authToken ${NPM_TOKEN}
          npm run publish:npm

      - name: Attach OpenAPI spec to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            contrib/jm-ng-openapi.json
            contrib/jm-ng-openapi.yaml
