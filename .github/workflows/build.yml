name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['v24.11.1']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup (Node.js ${{ matrix.node-version }})
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload built spec + dist as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: joinmarket-ng-api-ts-${{ github.sha }}
          path: |
            dist/
            contrib/jm-ng-openapi.json
            contrib/jm-ng-openapi.yaml
          retention-days: 14
